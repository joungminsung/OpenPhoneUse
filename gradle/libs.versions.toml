[versions]
fragment = "1.8.9"
agp = "9.4.1"
kotlin = "2.4.10"
composeBom = "2026.06.01"
coroutines = "1.11.0"
serialization = "1.12.0"
okhttp = "5.5.1"
datastore = "1.3.0"
lifecycle = "2.10.0"
savedstate = "1.5.0"
activityCompose = "1.13.0"
junit = "4.13.2"
exifinterface = "1.4.2"
osmdroid = "6.1.20"
sqliteJdbc = "3.49.1.0"
window = "1.5.0"
playServicesLocation = "21.3.0"
glance = "1.2.0"
work = "2.11.2"
anthropic = "2.75.0"
aboutlibraries = "15.3.0"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-text-google-fonts = { module = "androidx.compose.ui:ui-text-google-fonts" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
savedstate = { module = "androidx.savedstate:savedstate", version.ref = "savedstate" }
junit = { module = "junit:junit", version.ref = "junit" }
exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
osmdroid = { module = "org.osmdroid:osmdroid-android", version.ref = "osmdroid" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }
window = { module = "androidx.window:window", version.ref = "window" }
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }
glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
glance-material3 = { module = "androidx.glance:glance-material3", version.ref = "glance" }
anthropic-java = { module = "com.anthropic:anthropic-java", version.ref = "anthropic" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
aboutlibraries = { id = "com.mikepenz.aboutlibraries.plugin.android", version.ref = "aboutlibraries" }
