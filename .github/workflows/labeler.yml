name: Label pull requests

# Marks a pull request that touches the safety-critical code listed in .github/labeler.yml. pull_request_target runs
# with the base branch's workflow and settings and never checks out the pull request's code, so a fork cannot change
# what gets labeled or run anything with this token.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    # Dependabot's pull requests get a read-only token here, and they are labeled "dependencies" already.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
