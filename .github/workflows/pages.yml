name: Website

# Publishes only the landing page and the files it uses, so the design notes and
# reviews elsewhere in docs/ stay out of search results.
on:
  push:
    branches: [main]
    paths:
      - docs/index.html
      - docs/sitemap.xml
      - docs/robots.txt
      - docs/media/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect the site
        run: |
          mkdir -p site/media/en
          cp docs/index.html docs/sitemap.xml docs/robots.txt site/
          cp -r docs/media/brand site/media/
          cp docs/media/icon.png site/media/
          cp docs/media/en/hero.png site/media/en/
          touch site/.nojekyll
          find site -type f | sort
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
