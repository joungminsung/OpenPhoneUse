<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA3B2"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E4572E"/>
    </marker>
  </defs>
  <rect width="1200" height="640" rx="24" fill="#0E1014"/>

  <!-- Phone boundary -->
  <rect x="40" y="70" width="760" height="530" rx="22" fill="#14171D" stroke="#2A2E36" stroke-width="2"/>
  <text x="66" y="104" fill="#9AA3B2" font-size="15" font-weight="600" letter-spacing="1.5">ON THE PHONE · NO ROOT · NO ADB</text>

  <!-- User -->
  <rect x="70" y="130" width="190" height="74" rx="14" fill="#1C2028" stroke="#3A404B"/>
  <text x="165" y="162" fill="#FFFFFF" font-size="19" font-weight="700" text-anchor="middle">You</text>
  <text x="165" y="186" fill="#9AA3B2" font-size="14" text-anchor="middle">"Add lotion to my cart"</text>

  <!-- AgentLoop -->
  <rect x="320" y="130" width="230" height="74" rx="14" fill="#1C2028" stroke="#E4572E" stroke-width="2"/>
  <text x="435" y="162" fill="#FFFFFF" font-size="19" font-weight="700" text-anchor="middle">AgentLoop</text>
  <text x="435" y="186" fill="#9AA3B2" font-size="14" text-anchor="middle">plan · act · read · repeat</text>

  <!-- Screen reader -->
  <rect x="320" y="270" width="230" height="86" rx="14" fill="#1C2028" stroke="#3A404B"/>
  <text x="435" y="300" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="middle">Screen → list + marks</text>
  <text x="435" y="323" fill="#9AA3B2" font-size="13.5" text-anchor="middle" font-family="Consolas, monospace">[3] Button "Search" (540,212)</text>
  <text x="435" y="343" fill="#9AA3B2" font-size="13.5" text-anchor="middle">old screens → one-line digests</text>

  <!-- ToolExecutor + RiskGuard -->
  <rect x="580" y="270" width="200" height="86" rx="14" fill="#1C2028" stroke="#3A404B"/>
  <text x="680" y="300" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="middle">ToolExecutor</text>
  <text x="680" y="323" fill="#9AA3B2" font-size="13.5" text-anchor="middle">re-checks the live screen</text>
  <text x="680" y="343" fill="#9AA3B2" font-size="13.5" text-anchor="middle">before every action</text>

  <rect x="580" y="390" width="200" height="86" rx="14" fill="#2A1A14" stroke="#E4572E" stroke-width="2"/>
  <text x="680" y="420" fill="#FFB49C" font-size="18" font-weight="700" text-anchor="middle">Risk check</text>
  <text x="680" y="443" fill="#E9C9BD" font-size="13.5" text-anchor="middle">model label + RiskGuard</text>
  <text x="680" y="463" fill="#E9C9BD" font-size="13.5" text-anchor="middle">→ confirm card when needed</text>

  <!-- Accessibility service -->
  <rect x="70" y="390" width="480" height="86" rx="14" fill="#1C2028" stroke="#3A404B"/>
  <text x="310" y="420" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="middle">AccessibilityService</text>
  <text x="310" y="443" fill="#9AA3B2" font-size="13.5" text-anchor="middle">tap · type · scroll · swipe · open app · deep link</text>
  <text x="310" y="463" fill="#9AA3B2" font-size="13.5" text-anchor="middle">waits until the UI settles, not fixed sleeps</text>

  <!-- Apps -->
  <rect x="70" y="510" width="710" height="62" rx="14" fill="#171A20" stroke="#2A2E36" stroke-dasharray="6 6"/>
  <text x="425" y="547" fill="#C9CED8" font-size="16" text-anchor="middle">Any app: Amazon · Maps · Chrome · YouTube · Settings · …</text>

  <!-- Cloud -->
  <rect x="850" y="70" width="310" height="530" rx="22" fill="#14171D" stroke="#2A2E36" stroke-width="2"/>
  <text x="876" y="104" fill="#9AA3B2" font-size="15" font-weight="600" letter-spacing="1.5">MODEL (YOUR PROVIDER)</text>

  <rect x="880" y="130" width="250" height="100" rx="14" fill="#1C2028" stroke="#E4572E" stroke-width="2"/>
  <text x="1005" y="164" fill="#FFFFFF" font-size="19" font-weight="700" text-anchor="middle">Main model · thinks</text>
  <text x="1005" y="188" fill="#9AA3B2" font-size="13.5" text-anchor="middle">plans, decides, answers</text>
  <text x="1005" y="208" fill="#9AA3B2" font-size="13.5" text-anchor="middle">reasoning carried step to step</text>

  <rect x="880" y="290" width="250" height="100" rx="14" fill="#1C2028" stroke="#3A404B"/>
  <text x="1005" y="324" fill="#FFFFFF" font-size="19" font-weight="700" text-anchor="middle">Helper · runs</text>
  <text x="1005" y="348" fill="#9AA3B2" font-size="13.5" text-anchor="middle">fast helper for mechanical work</text>
  <text x="1005" y="368" fill="#9AA3B2" font-size="13.5" text-anchor="middle">"scroll the list, collect prices"</text>

  <rect x="880" y="450" width="250" height="100" rx="14" fill="#1C2028" stroke="#3A404B"/>
  <text x="1005" y="484" fill="#FFFFFF" font-size="19" font-weight="700" text-anchor="middle">Web search</text>
  <text x="1005" y="508" fill="#9AA3B2" font-size="13.5" text-anchor="middle">weather, prices, opening hours</text>
  <text x="1005" y="528" fill="#9AA3B2" font-size="13.5" text-anchor="middle">without opening an app</text>

  <!-- Arrows -->
  <line x1="260" y1="167" x2="316" y2="167" stroke="#9AA3B2" stroke-width="2" marker-end="url(#a)"/>
  <line x1="550" y1="155" x2="876" y2="155" stroke="#E4572E" stroke-width="2" marker-end="url(#o)"/>
  <line x1="876" y1="190" x2="554" y2="190" stroke="#E4572E" stroke-width="2" marker-end="url(#o)"/>
  <text x="712" y="146" fill="#C9CED8" font-size="13" text-anchor="middle">screen + screenshot + goal</text>
  <text x="712" y="210" fill="#C9CED8" font-size="13" text-anchor="middle">tool calls (batched across screens)</text>
  <line x1="1005" y1="230" x2="1005" y2="286" stroke="#9AA3B2" stroke-width="2" marker-end="url(#a)"/>
  <text x="1015" y="263" fill="#C9CED8" font-size="13">delegate</text>
  <line x1="1005" y1="230" x2="1005" y2="286" stroke="none"/>
  <path d="M1130 180 C 1175 240, 1175 440, 1130 500" fill="none" stroke="#9AA3B2" stroke-width="2" marker-end="url(#a)"/>
  <line x1="500" y1="204" x2="640" y2="266" stroke="#9AA3B2" stroke-width="2" marker-end="url(#a)"/>
  <line x1="680" y1="356" x2="680" y2="386" stroke="#E4572E" stroke-width="2" marker-end="url(#o)"/>
  <line x1="580" y1="433" x2="554" y2="433" stroke="#9AA3B2" stroke-width="2" marker-end="url(#a)"/>
  <line x1="310" y1="476" x2="310" y2="506" stroke="#9AA3B2" stroke-width="2" marker-end="url(#a)"/>
  <line x1="200" y1="506" x2="200" y2="480" stroke="#9AA3B2" stroke-width="2" marker-end="url(#a)"/>
  <line x1="300" y1="390" x2="380" y2="360" stroke="#9AA3B2" stroke-width="2" marker-end="url(#a)"/>
  <line x1="435" y1="270" x2="435" y2="208" stroke="#9AA3B2" stroke-width="2" marker-end="url(#a)"/>
</svg>
