<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenPhoneUse · film</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<!--
  The promo film. One drop of liquid glass becomes everything: a lens over the words, the prompt bar, the phone
  that does the work, one tile among the 31 benchmark tasks. Glass is real refraction: backdrop-filter runs an SVG
  displacement map shaped to each piece, so the edges bend whatever passes behind them.

  Cut to a 120 BPM grid (a beat is 0.5 s, a bar 2 s, the drop at 0:08), so a 120 BPM track lines up without editing.
  Every frame is a pure function of one virtual clock T, so render.mjs can step it at any frame rate and supersample
  it for motion blur. Open it in Chrome to preview; ?v=9x16 is the vertical cut, ?t=12 starts at 12 s.
-->
<style>
:root { --sans: "Geist", system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace; --serif: "Instrument Serif", Georgia, serif;
  --acc: #ff5a2a; --acc2: #ffa071; --vio: #7a5cff; --ink: #0a0a0c; --paper: #f3f1ec; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #000; overflow: hidden; }
body { font-family: var(--sans); color: #f5f5f7; -webkit-font-smoothing: antialiased; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #050507; transform-origin: 0 0; }
.v #stage { width: 1080px; height: 1920px; }
#bg { position: absolute; inset: 0; }
.amb { position: absolute; left: 0; top: 0; width: 1400px; height: 1400px; margin: -700px 0 0 -700px; border-radius: 50%; opacity: 0;
  background: radial-gradient(closest-side, var(--c, #ff5a2a), transparent); filter: blur(60px); }
#cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
section { position: absolute; inset: 0; display: none; }
.abs { position: absolute; }
.o { position: absolute; visibility: hidden; white-space: nowrap; }
em { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: -.02em; }
.acc { color: var(--acc); }
.mono { font-family: var(--mono); letter-spacing: .16em; text-transform: uppercase; font-weight: 500; }
.k { display: inline-block; white-space: pre; }
.line { display: block; overflow: hidden; padding: .04em .06em .12em; margin: -.04em -.06em -.12em; }

/* ---------- liquid glass ---------- */
.gl { position: absolute; overflow: hidden; isolation: isolate;
  background: linear-gradient(180deg, rgba(255, 255, 255, .13), rgba(255, 255, 255, .03) 45%, rgba(255, 255, 255, .07));
  box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, .75), inset 0 -1.5px 0 rgba(255, 255, 255, .22), inset 1.5px 0 0 rgba(255, 255, 255, .22),
    inset -1.5px 0 0 rgba(255, 255, 255, .12), inset 0 0 40px rgba(255, 255, 255, .07), 0 40px 90px -30px rgba(0, 0, 0, .65); }
.gl::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 3;
  background: radial-gradient(120% 60% at 18% -10%, rgba(255, 255, 255, .35), transparent 55%), radial-gradient(80% 50% at 100% 120%, rgba(255, 255, 255, .14), transparent 60%); }
.gl.lite { background: linear-gradient(180deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, .25));
  box-shadow: inset 0 2px 0 #fff, inset 0 -1.5px 0 rgba(255, 255, 255, .7), 0 30px 70px -30px rgba(80, 40, 20, .45), 0 0 0 1px rgba(0, 0, 0, .04); }

/* the hero: a drop, then the prompt bar, then the phone */
#hero { z-index: 20; transform-origin: 50% 50%; }
#hero .scr { position: absolute; inset: 12px; border-radius: inherit; overflow: hidden; background: #000; opacity: 0; z-index: 1; }
#hero .scr img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; visibility: hidden; }
#hero .ptx { position: absolute; left: 70px; top: 50%; transform: translateY(-50%); font-size: 62px; font-weight: 560; letter-spacing: -.035em; white-space: nowrap; z-index: 2; }
.v #hero .ptx { left: 52px; font-size: 44px; }
#hero .car { display: inline-block; width: 5px; height: .9em; margin-left: 6px; background: var(--acc); vertical-align: -.12em; border-radius: 2px; }
#hero .snd { position: absolute; right: 22px; top: 50%; width: 132px; height: 132px; margin-top: -66px; border-radius: 50%; background: #fff; color: var(--ink); display: grid; place-items: center; z-index: 2; opacity: 0; }
.v #hero .snd { width: 108px; height: 108px; margin-top: -54px; right: 20px; }
#hero .snd svg { width: 56px; height: 56px; }
.rip { position: absolute; width: 130px; height: 130px; margin: -65px 0 0 -65px; border-radius: 50%; border: 3px solid #fff; opacity: 0; z-index: 30; pointer-events: none; }
.rip::after { content: ""; position: absolute; inset: 38px; border-radius: 50%; background: rgba(255, 255, 255, .9); }

/* A: busywork */
.bw { position: absolute; font-weight: 900; letter-spacing: -.06em; line-height: .9; white-space: nowrap; transform-origin: 50% 50%; }
.tally { position: absolute; font: 500 22px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: rgba(255, 255, 255, .6); }
.tally b { color: #fff; font-weight: 600; font-variant-numeric: tabular-nums; }

/* type sizes */
.huge { font-weight: 800; letter-spacing: -.065em; line-height: .88; }
.huge em { font-weight: 400; letter-spacing: -.03em; }

/* C: tasks */
#cp .ptx { position: absolute; left: 44px; right: 120px; top: 50%; transform: translateY(-50%); font-size: 44px; font-weight: 560; letter-spacing: -.03em; white-space: nowrap; z-index: 2; }
#cp .mic { position: absolute; right: 18px; top: 50%; width: 86px; height: 86px; margin-top: -43px; border-radius: 50%; background: var(--acc); display: grid; place-items: center; z-index: 2; }
#cp .mic svg { width: 40px; height: 40px; }
.v #cp .ptx { font-size: 40px; left: 36px; }

/* C2: the grid */
#gplate { z-index: 24; } #g31 { z-index: 25; }
#done { z-index: 21; text-shadow: 0 12px 70px rgba(0, 0, 0, .6); }
.tile { position: absolute; border-radius: 26px; overflow: hidden; background: #111; box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .22), 0 20px 50px -20px rgba(0, 0, 0, .8); visibility: hidden; }
.tile img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; display: block; }
.tile::after { content: ""; position: absolute; inset: 0; background: linear-gradient(150deg, rgba(255, 255, 255, .22), transparent 40%); }

/* D: confirm card */
#card { color: #fff; padding: 52px 56px; }
#card .h { display: flex; align-items: center; gap: 18px; font: 600 26px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--acc2); position: relative; z-index: 2; }
#card .h i { width: 50px; height: 50px; border-radius: 16px; background: rgba(255, 90, 42, .22); display: grid; place-items: center; font: 700 30px var(--sans); font-style: normal; color: var(--acc2); }
#card .b { margin-top: 26px; font-size: 58px; font-weight: 700; letter-spacing: -.04em; line-height: 1.06; position: relative; z-index: 2; }
#card .d { margin-top: 22px; font-size: 30px; color: rgba(255, 255, 255, .72); position: relative; z-index: 2; }
#card .a { margin-top: 38px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; position: relative; z-index: 2; }
#card .a span { display: grid; place-items: center; height: 110px; border-radius: 55px; font-size: 38px; font-weight: 650; letter-spacing: -.02em; }
#card .no { background: rgba(255, 255, 255, .1); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .45); }
#card .yes { background: #fff; color: var(--ink); }
.v #card { padding: 46px 46px; } .v #card .b { font-size: 54px; }

/* E: no PC */
.np { font-size: 380px; font-weight: 900; letter-spacing: -.07em; }

/* E2: light */
#tog { display: flex; align-items: center; gap: 34px; padding: 0 46px 0 30px; color: var(--ink); }
#tog .sw { position: relative; width: 156px; height: 92px; border-radius: 46px; background: #cfcbc4; flex: none; z-index: 2; }
#tog .sw i { position: absolute; left: 8px; top: 8px; width: 76px; height: 76px; border-radius: 50%; background: #fff; box-shadow: 0 6px 16px rgba(0, 0, 0, .25); }
#tog img { width: 92px; height: 92px; flex: none; position: relative; z-index: 2; border-radius: 22px; }
#tog b { display: block; font-size: 46px; letter-spacing: -.035em; position: relative; z-index: 2; }
#tog small { display: block; font: 500 20px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: #6d6b66; margin-top: 6px; position: relative; z-index: 2; }

/* F: models */
.bub { display: grid; place-items: center; border-radius: 50%; }
.bub svg { width: 46%; height: 46%; position: relative; z-index: 2; }

/* G: proof */
.digit { display: inline-block; font-variant-numeric: tabular-nums; }
.cap { position: absolute; display: grid; grid-template-columns: 200px 1fr 110px; align-items: center; gap: 26px; font-size: 32px; font-weight: 560; letter-spacing: -.02em; visibility: hidden; }
.cap .t { position: relative; height: 34px; border-radius: 17px; background: rgba(255, 255, 255, .07); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .14); overflow: hidden; }
.cap .t i { position: absolute; left: 3px; top: 3px; bottom: 3px; border-radius: 14px; background: linear-gradient(90deg, var(--vio), var(--acc) 70%, var(--acc2));
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .55), inset 0 -2px 4px rgba(0, 0, 0, .2); transform-origin: left; }
.cap .vv { text-align: right; font: 500 30px var(--mono); }

/* G2: the ring */
#ring { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }
.rp { position: absolute; width: 280px; height: 620px; margin: -310px 0 0 -140px; border-radius: 46px; overflow: hidden; backface-visibility: hidden;
  box-shadow: 0 0 0 2px rgba(255, 255, 255, .3), 0 0 0 10px rgba(255, 255, 255, .06); background: #000; }
.rp img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; display: block; }
.rp::after { content: ""; position: absolute; inset: 0; background: linear-gradient(140deg, rgba(255, 255, 255, .28), transparent 35%); }

/* H: end */
#url { display: flex; align-items: center; gap: 18px; padding: 0 44px; font: 600 34px var(--mono); color: #fff; }
#url svg { width: 40px; height: 40px; fill: #fff; position: relative; z-index: 2; } #url span { position: relative; z-index: 2; }
.v #url { font-size: 27px; padding: 0 34px; }

/* overlays */
.hud { position: absolute; z-index: 92; font: 500 17px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: rgba(255, 255, 255, .55); white-space: nowrap; }
.hud b { color: #fff; font-weight: 600; }
.hud i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--acc); margin-right: 12px; vertical-align: 1px; }
#hTL { left: 56px; top: 44px; } #hTR { right: 56px; top: 44px; } #hBL { left: 56px; bottom: 40px; } #hBR { right: 56px; bottom: 40px; }
.v .hud { font-size: 15px; } .v #hTL, .v #hBL { left: 44px; } .v #hTR, .v #hBR { right: 44px; } .v #hTL, .v #hTR { top: 56px; } .v #hBL, .v #hBR { bottom: 56px; }
#stage.inv .hud { color: rgba(10, 10, 12, .55); } #stage.inv .hud b { color: var(--ink); }
#flash { position: absolute; inset: 0; z-index: 95; background: #fff; opacity: 0; pointer-events: none; }
.vig { position: absolute; inset: 0; z-index: 88; pointer-events: none; background: radial-gradient(130% 100% at 50% 50%, transparent 62%, rgba(0, 0, 0, .45)); }
#stage.inv .vig { opacity: .25; }
.grain { position: absolute; inset: -10%; z-index: 90; pointer-events: none; opacity: .06; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"><div class="amb" id="amb0"></div><div class="amb" id="amb1"></div><div class="amb" id="amb2"></div></div>
  <div id="cam">
    <section id="A"><div id="bws"></div><div class="tally" id="tally"></div></section>
    <section id="A2"><div class="o huge" id="wy1"></div><div class="o huge" id="wy2"></div></section>
    <section id="A3"><div class="o" id="mq1"></div><div class="o" id="mq2"></div></section>
    <section id="B"><div class="o huge acc" id="done"></div><div class="o huge" id="wm"></div><div class="o" id="tag"></div></section>
    <section id="C"><div class="o huge" id="cw"></div><div class="gl o" id="cp"><div class="ptx" id="cpt"></div><span class="mic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span></div><div class="o mono" id="clab" style="font-size:22px;color:rgba(255,255,255,.6)"></div></section>
    <section id="C2"><div id="tiles"></div><div class="gl o" id="gplate"></div><div class="o huge" id="g31"></div></section>

      <i class="rip" id="drip"></i><div class="o huge" id="first"></div><div class="o mono" id="firstsub" style="font-size:24px;color:rgba(255,255,255,.62)"></div></section>
    <section id="E"><div id="nps"></div><div class="gl o" id="ebar"></div><div class="o mono" id="npl" style="font-size:24px;color:rgba(255,255,255,.55)">Not needed</div></section>
    <section id="E2"><div class="amb" id="lb0" style="filter:blur(70px)"></div><div class="amb" id="lb1" style="filter:blur(70px)"></div><div class="o huge" id="ja"></div>
      <div class="gl lite o" id="tog"><span class="sw" id="sw"><i></i></span><img src="../media/brand/icon-light.svg" alt=""><span><b>OpenPhoneUse</b><small>Settings › Accessibility</small></span></div></section>
    <section id="F"><div class="o huge" id="fname"></div><div class="o mono" id="fsub" style="font-size:26px;color:rgba(255,255,255,.7)"></div><div id="bubs"></div></section>
    <section id="G"><div class="o huge" id="num"></div><div class="o" id="g100"></div><div class="o mono" id="glab" style="font-size:24px;color:rgba(255,255,255,.62)"></div><div id="caps"></div><div class="gl o" id="lens"></div></section>
    <section id="G2"><div id="ring"></div><div class="o huge" id="say1"></div><div class="o huge" id="say2"></div></section>

      <div class="gl o" id="url"><svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg><span>github.com/joungminsung/openphoneuse</span></div>

<script>
(() => {
  const Q = new URLSearchParams(location.search);
  const V = Q.get('v') === '9x16';
  if (V) document.documentElement.classList.add('v');
  const W = V ? 1080 : 1920, H = V ? 1920 : 1080;
  const CONFIG = { bench: 94.5, rows: [['Apps', 100], ['Web', 100], ['Safety', 99], ['Media', 97.1], ['Settings', 96.8], ['Maps', 96.8], ['Research', 95.3], ['Chains', 84.3], ['Games', 74.3]] };

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const k = (T, a, b) => clamp((T - a) / (b - a));
  const eo = t => 1 - Math.pow(1 - t, 3);
  const eo5 = t => 1 - Math.pow(1 - t, 5);
  const ei = t => t * t * t;
  const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const back = (t, c = 1.7) => 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);
  const spring = t => t >= 1 ? 1 : 1 - Math.exp(-6 * t) * Math.cos(t * 13); // settles with one soft wobble
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const f2 = n => (+n).toFixed(3);
  const px = n => (+n).toFixed(1) + 'px';

  /* ---------- the grid: 120 BPM, a beat is half a second, a bar is two ---------- */
  const B = .5;
  const S = { A: 0, A2: 4, A3: 6, B: 8, C: 12, C2: 18, D: 20, E: 24, E2: 26, F: 28, G: 32, G2: 36, H: 40, END: 46 };
  const ORDER = ['A', 'A2', 'A3', 'B', 'C', 'C2', 'D', 'E', 'E2', 'F', 'G', 'G2', 'H'];
  const LABEL = { A: '01 · The old way', A2: '02 · Ask', A3: '02 · Ask', B: '03 · Done', C: '04 · Everything', C2: '05 · Proof', D: '06 · Guard', E: '07 · Install', E2: '07 · Install', F: '08 · Models', G: '09 · Score', G2: '10 · Say it', H: '11 · Get it' };
  const FLASH = [[8, .9], [12, .35], [18, .5], [24, .45], [28, .5], [32, .45], [36, .35], [40, .7]];

  /* ---------- liquid glass: a displacement map shaped like each piece ---------- */
  // Each map pushes the edge of a rounded rectangle outward along its normal, strongest at the rim, so whatever is
  // behind the glass bends at the edges like a thick lens. The map is drawn once per shape and stretched to size.
  const NS = 'http://www.w3.org/2000/svg';
  const fx = $('#fx');
  const maps = [];
  function glassFilter(id, w, h, r, { band = .32, scale = 90, blur = 1.5, sat = 1.6, bri = 1.08 } = {}) {
    const s = Math.min(1, 360 / Math.max(w, h)), cw = Math.max(8, Math.round(w * s)), ch = Math.max(8, Math.round(h * s)), cr = r * s;
    const c = document.createElement('canvas'); c.width = cw; c.height = ch;
    const x = c.getContext('2d'), im = x.createImageData(cw, ch), bd = Math.max(4, Math.min(cw, ch) * band);
    for (let j = 0; j < ch; j++) for (let i = 0; i < cw; i++) {
      const pxx = i + .5 - cw / 2, pyy = j + .5 - ch / 2, qx = Math.abs(pxx) - (cw / 2 - cr), qy = Math.abs(pyy) - (ch / 2 - cr);
      const out = Math.hypot(Math.max(qx, 0), Math.max(qy, 0)), d = Math.min(Math.max(qx, qy), 0) + out - cr;
      let nx = 0, ny = 0;
      if (qx > 0 || qy > 0) { const l = out || 1; nx = Math.max(qx, 0) / l * Math.sign(pxx); ny = Math.max(qy, 0) / l * Math.sign(pyy); }
      else if (qx > qy) nx = Math.sign(pxx); else ny = Math.sign(pyy);
      const t = clamp(1 + d / bd), st = t * t * (3 - 2 * t), q = (j * cw + i) * 4;
      im.data[q] = 128 - nx * st * 127; im.data[q + 1] = 128 - ny * st * 127; im.data[q + 2] = 128; im.data[q + 3] = 255;
    }
    x.putImageData(im, 0, 0);
    const url = c.toDataURL();
    const f = document.createElementNS(NS, 'filter');
    f.setAttribute('id', id); f.setAttribute('x', '0'); f.setAttribute('y', '0'); f.setAttribute('width', '100%'); f.setAttribute('height', '100%');
    f.setAttribute('color-interpolation-filters', 'sRGB');
    f.innerHTML = `<feImage href="${url}" x="0" y="0" width="${w}" height="${h}" preserveAspectRatio="none" result="m"/><feDisplacementMap in="SourceGraphic" in2="m" scale="${scale}" xChannelSelector="R" yChannelSelector="G"/>`;
    fx.appendChild(f);
